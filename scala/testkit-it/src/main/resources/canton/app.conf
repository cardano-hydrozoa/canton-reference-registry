// Single-process Canton for integration tests: one synchronizer (BFT sequencer +
// mediator) + one participant, in-memory storage. Same shape as
// daml/canton/topology.conf. The image layers this under /app/app.conf alongside
// its bundled parameters.conf/monitoring.conf. Ledger API on 5011 (exposed).
canton {
  sequencers.sequencer1 {
    storage.type = memory
    public-api.port = 5001
    admin-api.port = 5002
    sequencer.type = BFT
  }

  mediators.mediator1 {
    storage.type = memory
    admin-api.port = 5202
  }

  participants.participant1 {
    storage.type = memory
    admin-api.port = 5012
    // Bind on all interfaces so the Docker port-forward can reach the Ledger API
    // from the host (Canton defaults to 127.0.0.1, unreachable across the NAT).
    ledger-api.address = "0.0.0.0"
    ledger-api.port = 5011
    http-ledger-api.port = 5013
  }
}
