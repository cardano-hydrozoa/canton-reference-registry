# SLF4J backend for tests. Mainly so testcontainers' Docker diagnostics are visible during the
# gated Canton integration test (otherwise it logs to a no-op and failures are opaque).
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.testcontainers=info
org.slf4j.simpleLogger.log.com.github.dockerjava=warn
