sdk-version: 3.5.2
name: scratch
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  # Canton Network Token Standard V2 (CIP-0112) + the V1 packages it builds on.
  # Built from canton-network/splice @ tag 0.6.11 by nix/vendored.nix and symlinked into
  # dars/vendored/ on devShell entry (gitignored; see dars/vendored/README.md). Daml-LF 2.1.
  - dars/vendored/splice-api-token-metadata-v1-1.0.0.dar
  - dars/vendored/splice-api-token-holding-v1-1.0.0.dar
  - dars/vendored/splice-api-token-holding-v2-1.0.0.dar
  - dars/vendored/splice-api-token-allocation-v1-1.0.0.dar
  - dars/vendored/splice-api-token-allocation-v2-1.0.0.dar
  - dars/vendored/splice-api-token-allocation-request-v1-1.0.0.dar
  - dars/vendored/splice-api-token-allocation-request-v2-1.0.0.dar
  - dars/vendored/splice-api-token-allocation-instruction-v1-1.0.0.dar
  - dars/vendored/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - dars/vendored/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - dars/vendored/splice-api-token-transfer-instruction-v2-1.0.0.dar
  - dars/vendored/splice-api-token-transfer-events-v2-1.0.0.dar
  - dars/vendored/splice-token-standard-utils-2.0.0.dar
build-options:
  # Daml-LF 2.1 is the target the Canton 3.5.15 runtime accepts.
  - --target=2.1
