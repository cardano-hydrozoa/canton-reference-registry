// Local single-process Canton for scratch experiments: one synchronizer we own
// (BFT sequencer + mediator) plus one participant. In-memory storage —
// ephemeral, no Postgres. Add participants here to try multi-party / multi-node
// scenarios. Ports: 50xx.
canton {
  sequencers.sequencer1 {
    storage.type = memory
    public-api.port = 5001
    admin-api.port = 5002
    sequencer.type = BFT
  }

  mediators.mediator1 {
    storage.type = memory
    admin-api.port = 5202
  }

  participants.participant1 {
    storage.type = memory
    admin-api.port = 5012
    ledger-api.port = 5011
    http-ledger-api.port = 5013
  }
}
