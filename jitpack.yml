# JitPack build config. The Scala library lives under scala/ (this repo also holds a daml/ project),
# so cd there before publishing. Without this file JitPack builds with an old default JDK; sbt 2 (see
# scala/project/build.properties) needs a modern one.
#
# JitPack's bundled `sbt` launcher is sbt-1-era and cannot bootstrap sbt 2 (it mis-resolves sbt 2's
# Scala-3 compiler as `org.scala-lang:scala-compiler`, which does not exist). So we fetch sbt 2.0.1's
# own launcher and run publishM2 with it.
#
# The build reads the vendored splice DARs (daml/dars/vendored/*.dar) and OpenAPI specs
# (scala/registry-openapi/*.yaml) as codegen/resource inputs; those are committed (not the nix
# symlinks the devShell lays down), so this build needs no nix.
jdk:
  - openjdk21
install:
  - curl -fsSL https://github.com/sbt/sbt/releases/download/v2.0.1/sbt-2.0.1.tgz | tar xz -C "$HOME" && cd scala && "$HOME/sbt/bin/sbt" publishM2
